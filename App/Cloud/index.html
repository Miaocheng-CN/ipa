<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>同步与备份</title><link rel="stylesheet" href="style.css"></head><body><header><h1>同步与备份</h1><p>先把手机旧记录带到服务器，再让三个端接着使用。</p></header><main><section><h2>① 先导出手机旧数据</h2><p>更新 APK 后，先在这台有旧记录的手机上导出 JSON 备份。把文件复制到 Windows 服务器，在数据中心检查数量后导入。</p><button id="export">导出本机记录备份</button><small>包含历史、续播、收藏、漫画书架与页码、设置、游戏存档和下载记录。视频文件、临时图片缓存、终端文件与密钥不随记录备份迁移。</small></section><section><h2>② 连接服务器开始同步</h2><p>服务器导入完成后，在本机管理页生成配对码。每个设备使用一个新配对码。</p><form id="pair"><label>服务器 HTTPS 地址<input id="url" type="url" placeholder="https://sync.example.com" required></label><label>这台设备的名称<input id="name" maxlength="80" placeholder="我的手机 / 电脑 / iPad" required></label><label>一次性配对码<input id="code" autocomplete="off" placeholder="管理页显示的配对码" required></label><button type="submit">连接并开始同步</button></form><p>首次连接会另外备份本机旧数据。重复条目先采用服务器已导入的手机记录，本机独有条目追加合并。</p></section><section><h2>同步状态</h2><p id="status">正在检查…</p><label class="switch"><input id="enabled" type="checkbox">打开应用时自动同步，使用中定期同步</label><div class="actions"><button id="sync">立即同步</button><button id="refresh">刷新状态</button></div><p id="result" role="status"></p><div id="conflicts"></div></section></main><script src="model.js"></script><script src="engine.js"></script><script src="runtime.js"></script><script src="ui.js"></script></body></html>
