
name: Build iPad IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find . -name "Build-iPad.command" -type f -print -quit)
          if [ -z "$SCRIPT" ]; then
            echo "找不到工程打包脚本"
            ls -la
            exit 1
          fi
          bash "$SCRIPT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Qingying-iPad-1.1.36
          path: "**/build/*.ipa"
          if-no-files-found: error
