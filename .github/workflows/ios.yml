name: Build iPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install project generator
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for physical iPad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          xcodebuild -version | tee output/toolchain.txt
          xcodebuild \
            -project Qingying.xcodeproj \
            -scheme Qingying \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee output/build.log

      - name: Package unsigned
