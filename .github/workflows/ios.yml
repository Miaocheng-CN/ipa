name: Build Qingying iPad
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: bash Build-iPad.command
      - uses: actions/upload-artifact@v4
        with:
          name: Qingying-iPad-1.1.40
          path: build/Qingying-iPad-1.1.40-unsigned.ipa
          if-no-files-found: error
